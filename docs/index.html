<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoony</title>
<style>
  :root{
    --bg:#FBF2F3; --surface:#FFF8F9; --line:#AD7C88;
    --ink:#4B3A3F; --ink-soft:#7A6167; --accent:#9E5266;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .card{
    max-width:420px; width:100%; background:var(--surface);
    border:1px solid var(--line); border-radius:20px; padding:28px 24px;
    text-align:center;
  }
  h1{font-size:24px; margin:0 0 12px}
  p{font-size:16px; line-height:1.5; color:var(--ink-soft); margin:0 0 16px}
  a{color:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <h1>Spoony</h1>
    <p>Planifica tu día por la energía que tienes, no por las horas. Sin cuenta, tus datos no salen del teléfono.</p>
    <p><a href="privacidad.html">Política de privacidad</a></p>
  </div>
</body>
</html>
